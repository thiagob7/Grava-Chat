# Infra de DESENVOLVIMENTO. A de producao vira no docker-compose.prod.yml (Fase 6).
name: gravae-chat

services:
  # O Prisma exige replica set no MongoDB (mesmo de um no so) pra transacoes.
  # O truque abaixo faz o proprio healthcheck rodar o rs.initiate() na primeira
  # subida: sem isso, `prisma db push` falha com "Transactions are not supported".
  mongo:
    image: mongo:8
    container_name: gravae-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  redis:
    image: redis:8-alpine
    container_name: gravae-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # 6381 no host de propósito: se já houver um Redis instalado na máquina
      # (o caso aqui), ele fica com a 6379 e o container perde silenciosamente —
      # a aplicação conecta no Redis errado e tudo "funciona" até você tentar
      # inspecionar o estado e não achar nada.
      - "6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Storage S3-compativel pros anexos e avatares. Em producao troca por Cloudflare R2
  # (mesma API S3, so muda endpoint e credenciais).
  minio:
    image: minio/minio:latest
    container_name: gravae-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: gravae
      MINIO_ROOT_PASSWORD: gravae-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cria o bucket na primeira subida e deixa publico pra leitura (avatar/anexo
  # sao servidos direto por URL; o upload continua sendo por presigned PUT).
  minio-init:
    image: minio/mc:latest
    container_name: gravae-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 gravae gravae-dev-secret &&
      mc mb --ignore-existing local/gravae-uploads &&
      mc anonymous set download local/gravae-uploads &&
      echo 'bucket gravae-uploads pronto'
      "

  # SFU: recebe o audio/video de cada pessoa e redistribui pros outros. Sem ele,
  # 5 pessoas em call = 20 conexoes ponto a ponto e a maquina de todo mundo sofre.
  livekit:
    image: livekit/livekit-server:latest
    container_name: gravae-livekit
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"      # signaling (WebSocket)
      - "7881:7881"      # fallback TCP do WebRTC
      - "7882:7882/udp"  # midia (o caminho normal)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
  redis-data:
  minio-data:
