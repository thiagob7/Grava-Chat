<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="presentation">
  <style>
    @keyframes gc-pulo { 0%,72%,100% { transform: translateY(0) } 80% { transform: translateY(-7px) } 88% { transform: translateY(0) } }
    @keyframes gc-pisca { 0%,92%,100% { transform: scaleY(0) } 94%,97% { transform: scaleY(1) } }
    .bicho { animation: gc-pulo 3.6s ease-in-out infinite }
    .palpebra { animation: gc-pisca 3.6s steps(1,end) infinite }
    .pe { transform-origin: 84px 18px }
    .pd { transform-origin: 116px 18px }
    @media (prefers-reduced-motion: reduce) { .bicho, .palpebra { animation: none } }
  </style>
  <g class="bicho">
    <ellipse cx="100" cy="42" rx="33" ry="17" fill="#57ab4a"/>
    <ellipse cx="100" cy="47" rx="24" ry="9" fill="#7cc96d"/>
    <ellipse cx="76" cy="52" rx="9" ry="6" fill="#4b9640"/>
    <ellipse cx="124" cy="52" rx="9" ry="6" fill="#4b9640"/>
    <circle cx="84" cy="22" r="13" fill="#57ab4a"/>
    <circle cx="116" cy="22" r="13" fill="#57ab4a"/>
    <circle cx="84" cy="21" r="8" fill="#f6f4ec"/>
    <circle cx="116" cy="21" r="8" fill="#f6f4ec"/>
    <circle cx="85" cy="22" r="4.2" fill="#1d2a1b"/>
    <circle cx="117" cy="22" r="4.2" fill="#1d2a1b"/>
    <ellipse class="palpebra pe" cx="84" cy="21" rx="8.4" ry="8.4" fill="#4b9640"/>
    <ellipse class="palpebra pd" cx="116" cy="21" rx="8.4" ry="8.4" fill="#4b9640"/>
    <path d="M86 40 q14 8 28 -1" fill="none" stroke="#2f6b28" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
