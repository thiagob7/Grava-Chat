<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="presentation">
  <style>
    @keyframes gc-cauda { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(7deg) } }
    @keyframes gc-espia { 0%,100% { transform: rotate(0deg) } 30% { transform: rotate(-9deg) } 62% { transform: rotate(4deg) } }
