# Publica a API na VM — e só depois que alguém aprovar.
#
# O deploy sempre saiu da máquina de quem estava programando, sem aprovação e
# sem registro. Em 08/09 isso publicou um commit não aprovado em produção,
# porque o script constrói a partir da branch aberta. Aqui o commit é o do
# `master`, e o ambiente `producao` segura o trabalho até um revisor liberar.
#
# O build acontece aqui, não na VM: ela tem 1/8 de núcleo e 1 GB, e compilar
# lá seria lento e arriscaria estourar a memória.
#
# O pacote vai por UMA conexão, para a entrada padrão de um script fixo do
# outro lado. A chave do GitHub não escolhe comando nem ganha terminal: se
# vazar, o pior que fazem é republicar o que já está no repositório.
name: API

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "yarn.lock"
      - ".github/workflows/api.yml"
  workflow_dispatch:

concurrency:
  # Uma publicação de cada vez. Duas ao mesmo tempo deixariam a VM com metade
  # de cada uma.
  group: publicar-api
  cancel-in-progress: false

jobs:
  # O web e a API saem do mesmo merge, mas o web vai primeiro: a API pode
  # apontar para uma rota que só o web novo tem (foi o caso do login pelo app).
  # Por isso a aprovação só é pedida depois que a Vercel publicou este commit.
  aguardar-web:
    name: Esperar o web na Vercel
    runs-on: ubuntu-latest
    permissions:
      deployments: read

    steps:
      - name: Conferir o deploy de produção deste commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            id=$(gh api "repos/$REPO/deployments?sha=$SHA&environment=Production" --jq '.[0].id // empty')

            if [ -n "$id" ]; then
              estado=$(gh api "repos/$REPO/deployments/$id/statuses" --jq '.[0].state // "pending"')

              case "$estado" in
                success) echo "web no ar"; exit 0 ;;
                failure|error) echo "o deploy do web falhou; a API não sobe sozinha"; exit 1 ;;
              esac
            elif [ "$i" -ge 20 ]; then
              # Commit que não mexe no web pode não gerar deploy na Vercel.
              echo "a Vercel não abriu deploy para este commit; seguindo"
              exit 0
            fi

            sleep 10
          done

          echo "a Vercel não terminou em dez minutos"
          exit 1

  publicar:
    name: Publicar em produção
    needs: aguardar-web
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: https://gravaechat-api.duckdns.org/api/publico/versao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn workspace @gravae/api build

      - name: package.json enxuto
        run: |
          node -e '
            const p = require("./apps/api/package.json");
            delete p.dependencies["@gravae/shared"];
            p.devDependencies = { prisma: p.devDependencies.prisma };
            p.scripts = { start: "node dist/server.js" };
            require("fs").writeFileSync("/tmp/api-package.json", JSON.stringify(p, null, 2));
          '

      - name: Preparar a chave
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Publicar
        env:
          ALVO: ubuntu@${{ vars.VM_HOST }}
        run: |
          mkdir -p pacote/prisma
          cp -r apps/api/dist pacote/dist
          cp apps/api/prisma/schema.prisma pacote/prisma/
          cp /tmp/api-package.json pacote/package.json

          tar czf - -C pacote . \
            | ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$ALVO"

      - name: Conferir que voltou com este commit
        run: |
          esperado=$(git rev-parse --short HEAD)

          for i in $(seq 1 20); do
            resposta=$(curl -sS --max-time 5 https://gravaechat-api.duckdns.org/api/publico/versao || true)
            if echo "$resposta" | grep -q "$esperado"; then
              echo "no ar: $resposta"
              exit 0
            fi
            sleep 3
          done

          echo "a API nao voltou com $esperado"
          exit 1
