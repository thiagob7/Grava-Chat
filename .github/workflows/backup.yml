name: Backup do banco

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: backup-banco
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: mongodump para o R2 privado
    runs-on: ubuntu-latest
    environment: backup

    env:
      MONGO_URI: ${{ secrets.BACKUP_MONGO_URI }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
      KEEP_DAYS: 30

    steps:
      - name: Conferir a configuração
        id: config
        run: |
          missing=""
          for name in MONGO_URI PASSPHRASE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::warning::Backup pulado, faltam segredos:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar o mongodump
        if: steps.config.outputs.ready == 'true'
        run: |
          curl -fsSL -o tools.deb https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.13.0.deb
          sudo apt-get install -y ./tools.deb >/dev/null

      - name: Gerar, cifrar e enviar
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          name="gravae-$(date -u +%Y-%m-%dT%H%MZ).archive.gz.enc"

          mongodump --uri="$MONGO_URI" --archive --gzip --quiet \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASSPHRASE \
            > "$name"

          [ "$(stat -c %s "$name")" -gt 1024 ] || { echo "backup pequeno demais, algo falhou"; exit 1; }

          aws s3 cp "$name" "s3://$R2_BUCKET/mongo/$name" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo "enviado: mongo/$name ($(stat -c %s "$name") bytes)"

      - name: Apagar os antigos
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          limit=$(date -u -d "-$KEEP_DAYS days" +%Y-%m-%d)

          aws s3 ls "s3://$R2_BUCKET/mongo/" --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $4}' \
            | while read -r file; do
                day=$(echo "$file" | sed -nE 's/^gravae-([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/p')
                if [ -n "$day" ] && [[ "$day" < "$limit" ]]; then
                  aws s3 rm "s3://$R2_BUCKET/mongo/$file" --endpoint-url "$R2_ENDPOINT" --only-show-errors
                  echo "apagado: $file"
                fi
              done
